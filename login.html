<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | Stackly ERP</title>
    <link rel="stylesheet" href="css/style.css?v=7">
    <style>
        body { overflow: hidden; }
        .auth-layout {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100%;
            padding: 2rem;
        }
        
        .auth-form-side {
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 2rem;
            max-width: 420px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            position: relative;
            z-index: 2;
        }
        
        .auth-visual-side {
            flex: 1.5;
            position: relative;
            overflow: hidden;
            background: var(--bg-card);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-visual-side img {
            width: 80%;
            border-radius: var(--radius-xl);
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
            position: relative;
            z-index: 2;
            border: 1px solid var(--border-color);
        }
        
        /* Auth Blobs */
        .auth-blob {
            position: absolute;
            filter: blur(100px);
            opacity: 0.5;
            border-radius: 50%;
            animation: pulse 10s infinite alternate;
        }
        .ab-1 { width: 500px; height: 500px; background: var(--primary); top: -100px; left: -100px; }
        .ab-2 { width: 400px; height: 400px; background: var(--secondary); bottom: -100px; right: -100px; animation-delay: -5s; }
        
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.3; }
            100% { transform: scale(1.2); opacity: 0.6; }
        }

        .auth-header {
            margin-bottom: 1rem;
        }
        .auth-header .logo { margin-bottom: 0.5rem; display: inline-flex; }
        .auth-header h2 { margin-bottom: 0.25rem; font-size: 1.5rem; }
        .auth-header p { margin-bottom: 0; font-size: 0.9rem; }
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
        .role-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; }
        .role-card-content {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 0.75rem 0.5rem; background: var(--bg-dark); border: 1px solid var(--border-color);
            border-radius: var(--radius-md); cursor: pointer; transition: var(--transition-fast);
            color: var(--text-muted); text-align: center; font-size: 0.85rem; font-weight: 500;
        }
        .role-card-content:hover { border-color: var(--primary); color: var(--text-main); }
        input[type="radio"]:checked + .role-card-content {
            background: rgba(16, 185, 129, 0.1); border-color: var(--primary); color: var(--primary);
        }

        .form-group {
            margin-bottom: 1rem;
        }
        .form-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .form-control {
            width: 100%;
            padding: 1rem;
            background: white !important;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: #333 !important;
            font-family: inherit;
            transition: var(--transition-fast);
        }
        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(16,185,129,0.2);
            background: white !important;
        }
        .form-control::placeholder {
            color: #666;
            opacity: 1;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: var(--text-muted);
            margin: 2rem 0;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-color);
        }
        .divider:not(:empty)::before { margin-right: 1rem; }
        .divider:not(:empty)::after { margin-left: 1rem; }

        .sso-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            width: 100%;
            padding: 1rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-main);
            cursor: pointer;
            transition: var(--transition-fast);
            font-weight: 600;
        }
        .sso-btn:hover {
            background: rgba(255,255,255,0.05);
        }

        @media (max-width: 1024px) {
            .auth-layout { flex-direction: column; }
            .auth-form-side { max-width: 100%; width: 100%; }
            .auth-visual-side { display: none; }
            body { overflow: auto; }
        }
    </style>
</head>
<body>

    <div class="auth-layout">
        <div class="auth-form-side">
            <div class="auth-header">
                <a href="index.html" class="logo">
                    <div class="logo-icon">S</div>
                </a>
                <h2>Welcome back</h2>
                <p class="text-muted">Enter your credentials to access your workspace.</p>
            </div>
            
            <form class="auth-form">
                <div class="form-group">
                    <label class="form-label">Role</label>
                    <div class="role-cards">
                        <label>
                            <input type="radio" name="role" value="admin" required class="sr-only">
                            <div class="role-card-content">Admin</div>
                        </label>
                        <label>
                            <input type="radio" name="role" value="manager" required class="sr-only">
                            <div class="role-card-content">Manager</div>
                        </label>
                        <label>
                            <input type="radio" name="role" value="employee" required class="sr-only">
                            <div class="role-card-content">Employee</div>
                        </label>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Work Email</label>
                    <input type="email" class="form-control" placeholder="name@company.com" required>
                </div>
                
                <div class="form-group">
                    <div class="form-label">
                        <span>Password</span>
                        <a href="404.html" style="font-size: 0.8rem;">Forgot password?</a>
                    </div>
                    <input type="password" class="form-control" placeholder="••••••••" required>
                </div>
                
                <div class="form-group" style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem;">
                    <input type="checkbox" id="rememberMe" style="width: 1rem; height: 1rem; cursor: pointer; accent-color: var(--primary);">
                    <label for="rememberMe" style="font-size: 0.9rem; color: var(--text-muted); cursor: pointer; user-select: none;">Remember me</label>
                </div>

                <button type="submit" class="btn btn-primary w-full" style="padding: 0.75rem;">Log In</button>
            </form>
            <p class="text-center text-muted" style="margin-top: 1rem; margin-bottom: 0; font-size: 0.9rem;">
                Don't have an account? <a href="signup.html">Request access</a>
            </p>
            <div style="text-align: center; margin-top: 1.5rem;">
                <a href="index.html" class="btn btn-outline" style="font-size: 0.9rem; padding: 0.5rem 1rem;">&larr; Back to Home</a>
            </div>
        </div>
        
       
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
