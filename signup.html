<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Stackly ERP</title>
    <link rel="stylesheet" href="css/style.css?v=8">
    <style>
        body { overflow: hidden; }
        .auth-layout {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100%;
            padding: 2rem;
        }
        
        .auth-form-side {
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 2rem;
            max-width: 420px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            position: relative;
            z-index: 2;
        }
        
        .auth-visual-side {
            flex: 1.5;
            position: relative;
            overflow: hidden;
            background: var(--bg-card);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: white;
            text-align: center;
            padding: 4rem;
        }
        
        /* Auth Blobs */
        .auth-blob {
            position: absolute;
            filter: blur(100px);
            opacity: 0.5;
            border-radius: 50%;
            animation: pulse 10s infinite alternate;
        }
        .ab-1 { width: 500px; height: 500px; background: var(--secondary); top: -100px; right: -100px; }
        .ab-2 { width: 400px; height: 400px; background: var(--primary); bottom: -100px; left: -100px; animation-delay: -5s; }
        
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.3; }
            100% { transform: scale(1.2); opacity: 0.6; }
        }

        .auth-header {
            margin-bottom: 1rem;
        }
        .auth-header .logo { margin-bottom: 0.5rem; display: inline-flex; }
        .auth-header h2 { margin-bottom: 0.25rem; font-size: 1.5rem; }
        .auth-header p { margin-bottom: 0; font-size: 0.9rem; }
        
        .form-group {
            margin-bottom: 1rem;
        }
        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .form-control {
            width: 100%;
            padding: 1rem;
            background: white !important;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: #333 !important;
            font-family: inherit;
            transition: var(--transition-fast);
        }
        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(16,185,129,0.2);
            background: white !important;
        }
        .form-control::placeholder {
            color: #666;
            opacity: 1;
        }

        .testimonial-box {
            position: relative;
            z-index: 2;
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: 3rem;
            max-width: 600px;
        }

        @media (max-width: 1024px) {
            .auth-layout { flex-direction: column; }
            .auth-form-side { max-width: 100%; width: 100%; }
            .auth-visual-side { display: none; }
            body { overflow: auto; }
        }
    </style>
</head>
<body>

    <div class="auth-layout">
        <div class="auth-form-side">
            <div class="auth-header">
                <a href="index.html" class="logo">
                    <div class="logo-icon">S</div>
                </a>
                <h2>Create your workspace</h2>
                <p class="text-muted">Start your 14-day free trial. No credit card required.</p>
            </div>
            
            <form class="auth-form">
                <div class="form-group">
                    <label class="form-label">Role</label>
                    <select class="form-control" required style="cursor: pointer; appearance: auto;">
                        <option value="" disabled selected>Select your role</option>
                        <option value="admin">Administrator</option>
                        <option value="manager">Manager</option>
                        <option value="employee">Employee</option>
                    </select>
                </div>
                
                <div class="grid grid-cols-2 gap-2" style="margin-bottom: 1rem;">
                    <div>
                        <label class="form-label">First Name</label>
                        <input type="text" class="form-control" placeholder="e.g. Jane" oninput="this.value = this.value.replace(/[^A-Za-z\s]/g, '')" required>
                    </div>
                    <div>
                        <label class="form-label">Last Name</label>
                        <input type="text" class="form-control" placeholder="e.g. Doe" oninput="this.value = this.value.replace(/[^A-Za-z\s]/g, '')" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Work Email</label>
                    <input type="email" class="form-control" placeholder="name@company.com" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div style="position: relative;">
                        <input type="password" class="form-control" placeholder="••••••••" required>
                        <button type="button" class="password-toggle" style="position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 0;">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Confirm Password</label>
                    <div style="position: relative;">
                        <input type="password" class="form-control" placeholder="••••••••" required>
                        <button type="button" class="password-toggle" style="position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 0;">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary w-full mt-4" style="padding: 0.75rem;">Sign Up</button>
            </form>
            
            <p class="text-center text-muted" style="margin-top: 1rem; margin-bottom: 0; font-size: 0.8rem;">
                By signing up, you agree to our <a href="404.html">Terms of Service</a> and <a href="404.html">Privacy Policy</a>.
            </p>
            
            <p class="text-center text-muted" style="margin-top: 1rem; margin-bottom: 0; font-size: 0.9rem;">
                Already have an account? <a href="login.html">Log In</a>
            </p>
        </div>
        

    </div>

    <script src="js/auth.js"></script>
</body>
</html>
